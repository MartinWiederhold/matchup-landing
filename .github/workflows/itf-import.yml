# ITF-Turnier-Import — täglicher Lauf
#
# Warum GitHub Actions und nicht ein Vercel-Cron: Der ITF-Endpunkt sitzt hinter
# Incapsula und braucht einen browserartigen Client (Playwright/Chromium). Der läuft
# in einer Vercel-Funktion nicht zuverlässig (Chromium-Bundle, 60-s-Grenze, und
# Rechenzentrums-IPs werden von Incapsula eher geblockt). Auf einem GitHub-Runner
# läuft das bestehende Skript `scripts/itf-import.mjs` UNVERÄNDERT.
#
# Pipeline (Reihenfolge wichtig — beide Importe ZUERST, dann EIN Geocoding, resolve ZULETZT):
#   1. itf-import      → ITF (MT/WT/JT) über Playwright/Chromium (Incapsula). Identität + Claims
#                        (upsert onConflict source_ref; NIE löschen — verschwundene Turniere bleiben)
#   2. wta-import      → WTA-Haupttour über reines fetch (Endpunkt hinter AWS CloudFront, KEINE
#                        Bot-Abwehr wie Incapsula → kein Playwright nötig)
#   3. geocode         → Nominatim, NUR Orte ohne Koordinaten — ITF UND WTA in EINEM Durchlauf.
#                        Nominatim erlaubt ≥1 Anfrage/Sekunde, der Cache greift → NICHT zweimal
#                        geocoden. Mehrdeutige Orte bleiben bewusst offen (kein Raten).
#   4. geocode-overrides → kuratierte manuelle Koordinaten erneut anwenden
#   5. resolve         → Claims → Stammfelder (jüngeres observed_at gewinnt → ein verlegtes
#                        Turnier bekommt das neue Datum)
#
# Beide Importe haben denselben exit-1-Wächter: 0 verwertbare Turniere → roter Lauf (kein
# stiller Nulllauf). resolve läuft NUR, wenn beide Importe erfolgreich waren (Step-Abhängigkeit).
#
# WICHTIG: `schedule` feuert nur auf dem DEFAULT-Branch (main). Diese Datei muss auf
# `main` liegen, damit der Tageslauf startet. `workflow_dispatch` erlaubt manuelles
# Auslösen (auch von einem Feature-Branch aus) zum Testen.
#
# Nötige Repo-Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_SERVICE_ROLE_KEY   (service_role, NICHT NEXT_PUBLIC)
#   NEXT_PUBLIC_SUPABASE_URL

name: Tour-Import ITF + WTA (täglich)

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC — vor den beiden App-Crons (05:30 / 06:00)
  workflow_dispatch: {} # manuell auslösbar

# Keine parallelen Läufe (sonst zwei Importe gleichzeitig in dieselben Tabellen).
concurrency:
  group: itf-import
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium

      # Secrets früh prüfen — ein fehlendes Secret soll sofort auffallen, nicht erst
      # nach dem langen ITF-Abruf.
      - name: Secrets vorhanden?
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY fehlt"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::NEXT_PUBLIC_SUPABASE_URL fehlt"; exit 1; }

      # 1. ITF-Import. Wächter (writableKept===0 → exit 1) macht einen stillen Nulllauf
      #    (Incapsula-Blockade) zu einem ROTEN Lauf.
      - name: 1 · ITF-Import (scharf)
        run: node scripts/itf-import.mjs --write

      # 2. WTA-Haupttour. Eigener Wächter (kept===0 → exit 1). Ein Fehlschlag hier stoppt
      #    die Kette VOR dem Geocoding (Steps laufen nur bei Erfolg der vorigen).
      - name: 2 · WTA-Import (scharf)
        run: node scripts/wta-import.mjs --write

      # 3. EIN Geocoding für ALLE neuen Orte (ITF + WTA) — der Cache verhindert Doppelabrufe.
      - name: 3 · Geokodierung (neue Orte, ITF + WTA)
        run: node scripts/geocode-tournaments.mjs

      - name: 4 · Manuelle Overrides
        run: node scripts/geocode-overrides.mjs --write

      - name: 5 · Claims auflösen
        run: node scripts/resolve-tournaments.mjs --write

      # Kennzahlen in die Job-Zusammenfassung — damit man ohne Log-Wühlen sieht, was lief.
      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "## Tour-Import ITF + WTA — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            if [ -f scripts/itf-import-report.md ]; then
              echo "### ITF-Import"
              sed -n '1,12p' scripts/itf-import-report.md
              echo ""
            fi
            if [ -f scripts/wta-import-report.md ]; then
              echo "### WTA-Import"
              sed -n '1,8p' scripts/wta-import-report.md
              echo ""
            fi
            if [ -f scripts/geocoding-report.md ]; then
              echo "### Geokodierung (noch ohne Koordinaten = Kuratierung nötig)"
              grep -iE "ohne Koordinaten|mehrdeutig|nicht gefunden|ambiguous|not_found" scripts/geocoding-report.md | head -20 || true
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Berichte als Artefakt — 14 Tage abrufbar, auch bei Fehlschlag.
      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-import-reports
          path: |
            scripts/itf-import-report.md
            scripts/wta-import-report.md
            scripts/geocoding-report.md
            scripts/resolve-report.md
          if-no-files-found: ignore
          retention-days: 14
